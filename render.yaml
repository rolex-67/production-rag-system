services:
  - type: web
    name: rag-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"

  - type: web
    name: rag-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: rag-backend
          envVarKey: RENDER_EXTERNAL_URL
